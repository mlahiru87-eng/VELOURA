<!doctype html>

  <head>
    <!-- Safeguard against third-party script errors (CORS / Cross-origin / Adblockers) -->
    <script>
      (function() {
        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (
            !message || 
            message === 'Script error.' || 
            message === 'Script error' ||
            (typeof message === 'string' && (
              message.includes('Script error') ||
              message.includes('ResizeObserver') ||
              message.includes('adsterra') ||
              message.includes('effectivecpmnetwork') ||
              message.includes('highperformanceformat')
            )) ||
            !source || 
            typeof source !== 'string' || 
            source.includes('effectivecpmnetwork') || 
            source.includes('highperformanceformat')
          ) {
            return true;
          }
          if (typeof originalOnError === 'function') {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          var isScriptErr = !event || 
            !event.message || 
            event.message === 'Script error.' || 
            event.message === 'Script error' ||
            (typeof event.message === 'string' && (
              event.message.includes('Script error') ||
              event.message.includes('effectivecpmnetwork') ||
              event.message.includes('highperformanceformat')
            )) ||
            (event.target && event.target.tagName === 'SCRIPT') ||
            (typeof event.filename === 'string' && (
              event.filename.includes('effectivecpmnetwork') || 
              event.filename.includes('highperformanceformat')
            ));

          if (isScriptErr) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event) {
            var reason = event.reason;
            if (!reason || (typeof reason === 'string' && (reason.includes('Script error') || reason.includes('Failed to fetch')))) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
