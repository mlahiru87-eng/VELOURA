<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="DtNhu7XuC0E9K2xuFz1wK5Qi-iswsVK0J9MMa_aSipk" />
    <title>Veloura - Premium Video Streaming</title>
    <!-- Safeguard against third-party script errors (CORS / Cross-origin / Adblockers) -->
    <script>
      (function() {
        window.onerror = function(message, source) {
          if (
            !message || 
            message === 'Script error.' || 
            !source || 
            typeof source !== 'string' || 
            source.includes('effectivecpmnetwork') || 
            source.includes('highperformanceformat')
          ) {
            return true;
          }
          return false;
        };
        window.addEventListener('error', function(event) {
          if (
            !event ||
            !event.filename || 
            event.message === 'Script error.' || 
            (event.target && event.target.tagName === 'SCRIPT') ||
            (typeof event.filename === 'string' && (event.filename.includes('effectivecpmnetwork') || event.filename.includes('highperformanceformat')))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.preventDefault) {
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
